syntax = "proto3";

package birchatlas.v1;

option go_package = "github.com/birchatlas/birchatlas/proto/v1;v1";

// BIRCH CF（Clustering Feature）向量
// CF = (N, LS, SS) 三参数可增量更新
message CFVector {
  int64 n = 1;                      // 点数
  repeated double ls = 2;           // 线性求和 (各维度)
  repeated double ss = 3;           // 平方和 (各维度)
}

// CF 节点（内部节点或叶子节点）
message CFNode {
  uint64 node_id = 1;
  CFVector cf = 2;
  repeated CFNode children = 3;     // 子节点（仅内部节点使用）
  repeated CFVector leaf_cfs = 4;   // 叶子 CF 列表（仅叶子节点使用）
  bool is_leaf = 5;
  double radius_threshold = 6;      // 半径阈值 T
}

// CF 树序列化格式
message CFTree {
  string tree_id = 1;
  string gateway_code = 2;
  string measure_point_id = 3;
  string data_type = 4;             // 1=底横筋 2=底纵筋 3=面横筋 4=面纵筋
  CFNode root = 5;
  int32 total_points = 6;
  int32 total_clusters = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  repeated CFVector centroids = 10; // 当前簇心列表
}

// CF 树增量更新消息
message CFTreeUpdate {
  string tree_id = 1;
  string gateway_code = 2;
  string measure_point_id = 3;
  string data_type = 4;
  repeated CFVector new_cfs = 5;    // 新增的 CF 向量
  repeated uint32 updated_leaf_indices = 6; // 更新的叶子索引
  int64 sequence_number = 7;
  int64 timestamp = 8;
}

// 云端合并请求
message CFmergeRequest {
  string merge_id = 1;
  repeated CFTree trees_to_merge = 2;
  string target_data_type = 3;
  uint32 target_points_threshold = 4; // 聚类后最少点数阈值
}

// 云端合并响应
message CFmergeResponse {
  string merge_id = 1;
  int32 total_clusters = 2;
  repeated MergedCluster clusters = 3;
  repeated double evaluation_metrics = 4;
  int64 timestamp = 5;
}

message MergedCluster {
  int32 cluster_id = 1;
  CFVector centroid = 2;
  int64 point_count = 3;
  double radius = 4;
  repeated string member_gateways = 5;
}

// 离群检测请求
message OutlierDetectRequest {
  string device_code = 1;
  string measure_point_id = 2;
  string data_type = 3;
  repeated double values = 4;
  double threshold_k = 5;            // k·σ 倍数阈值，默认 3.0
  int32 consecutive_outlier_limit = 6; // 连续离群次数触发告警
}

// 离群检测响应
message OutlierDetectResponse {
  bool has_outlier = 1;
  repeated OutlierPoint outliers = 2;
  CFVector current_cf = 3;
  double current_radius = 4;
}

message OutlierPoint {
  uint32 index = 1;
  double value = 2;
  double distance_to_nearest_cf = 3;
  double z_score = 4;
  string suggestion = 5;            // reject/flag/accept
}

// 聚类结果查询
message ClusterJobRequest {
  string job_id = 1;
  string algorithm = 2;             // kmeans/gmm/dbscan/hierarchical
  repeated string source_tables = 3;
  map<string, string> params = 4;
  repeated string features = 5;
}

message ClusterJobResponse {
  string job_id = 1;
  string status = 2;                 // pending/running/completed/failed
  int32 progress = 3;
  repeated ClusterPoint points = 4;
  ClusterEvaluation evaluation = 5;
  string error_message = 6;
}

message ClusterPoint {
  string id = 1;
  repeated double features = 2;
  int32 cluster_label = 3;
  double distance_to_centroid = 4;
}

message ClusterEvaluation {
  double silhouette_score = 1;
  double davies_bouldin = 2;
  double calinski_harabasz = 3;
  int32 n_clusters = 4;
  int32 n_points = 5;
  double stability_score = 6;
}